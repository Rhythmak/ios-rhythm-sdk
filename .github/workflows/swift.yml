name: Swift package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild -scheme Rhythm -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/RhythmDerivedData" CODE_SIGNING_ALLOWED=NO build
